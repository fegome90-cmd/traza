name: TRAZA quality

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - name: Install development-only YAML checker
        run: python -m pip install -r requirements-checks.txt
      - name: Lint, format, syntax, tests and build
        run: npm run verify
      - name: Reproducible build and diff hygiene
        run: |
          python scripts/build.py --output /tmp/traza-rebuilt.html
          cmp dist/index.html /tmp/traza-rebuilt.html
          git diff --check
